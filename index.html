<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>reed-web demo</title>
  <style>
    :root {
      --charcoal: #3a3a3c;
      --tonal: #e6e6eb;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f4f4f6;
      color: var(--charcoal);
      font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      width: min(560px, calc(100vw - 48px));
      padding: 32px 0 48px;
      text-align: center;
    }
    h1 { font-size: 22px; margin: 0 0 4px; }
    p.sub { margin: 0 0 28px; color: #6e6e73; font-size: 14px; }
    label {
      display: block; text-align: left;
      font-size: 12px; font-weight: 600; letter-spacing: .04em;
      text-transform: uppercase; color: #6e6e73; margin-bottom: 6px;
    }
    #endpoint {
      width: 100%; box-sizing: border-box;
      padding: 10px 12px; margin-bottom: 28px;
      border: 1px solid #d8d8de; border-radius: 10px;
      font: 14px ui-monospace, SFMono-Regular, Menlo, monospace;
      color: var(--charcoal); background: #fff;
    }
    #mic-slot { margin-bottom: 12px; }
    #status { min-height: 22px; font-size: 14px; color: #6e6e73; margin-bottom: 24px; }
    #status.error { color: #b3261e; }
    #transcript {
      text-align: left; background: #fff; border-radius: 14px;
      padding: 18px 20px; min-height: 72px;
      box-shadow: 0 6px 14px rgba(0, 0, 0, .06);
    }
    #transcript .empty { color: #aeaeb4; }
    #transcript p { margin: 0 0 10px; }
    #transcript p:last-child { margin-bottom: 0; }
  </style>
</head>
<body>
  <main>
    <h1>reed-web</h1>
    <p class="sub">Hold the mic, speak, release — clean text comes back.</p>

    <label for="endpoint">reed-backend endpoint</label>
    <input id="endpoint" value="http://localhost:8080/api/transcribe" spellcheck="false" />

    <div id="mic-slot"></div>
    <div id="status">Hold to talk</div>

    <div id="transcript"><span class="empty">Transcripts appear here.</span></div>
  </main>

  <script type="module">
    import "reed-web";

    const slot = document.getElementById("mic-slot");
    const endpointInput = document.getElementById("endpoint");
    const status = document.getElementById("status");
    const transcript = document.getElementById("transcript");

    // <reed-mic> reads its endpoint once when attached, so swap in a fresh
    // element whenever the endpoint changes.
    function mountMic() {
      slot.replaceChildren();
      const mic = document.createElement("reed-mic");
      mic.setAttribute("endpoint", endpointInput.value.trim());
      slot.append(mic);
    }
    endpointInput.addEventListener("change", mountMic);
    mountMic();

    slot.addEventListener("reed:result", (event) => {
      status.className = "";
      status.textContent = "Hold to talk";
      if (transcript.querySelector(".empty")) transcript.replaceChildren();
      const line = document.createElement("p");
      line.textContent = event.detail.text;
      transcript.append(line);
    });

    slot.addEventListener("reed:error", (event) => {
      status.className = "error";
      const error = event.detail.error;
      status.textContent = error instanceof Error ? error.message : String(error);
      console.error("reed:error", error);
    });
  </script>
</body>
</html>
