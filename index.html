<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>reed-web demo</title>
  <style>
    :root {
      --charcoal: #3a3a3c;
      --tonal: #e6e6eb;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f4f4f6;
      color: var(--charcoal);
      font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      width: min(560px, calc(100vw - 48px));
      padding: 32px 0 48px;
      text-align: center;
    }
    h1 { font-size: 22px; margin: 0 0 4px; }
    p.sub { margin: 0 0 28px; color: #6e6e73; font-size: 14px; }
    label {
      display: block; text-align: left;
      font-size: 12px; font-weight: 600; letter-spacing: .04em;
      text-transform: uppercase; color: #6e6e73; margin-bottom: 6px;
    }
    #endpoint {
      width: 100%; box-sizing: border-box;
      padding: 10px 12px; margin-bottom: 20px;
      border: 1px solid #d8d8de; border-radius: 10px;
      font: 14px ui-monospace, SFMono-Regular, Menlo, monospace;
      color: var(--charcoal); background: #fff;
    }
    #language {
      width: 100%; box-sizing: border-box;
      padding: 10px 12px; margin-bottom: 28px;
      border: 1px solid #d8d8de; border-radius: 10px;
      font: 15px/1.4 inherit; color: var(--charcoal); background: #fff;
    }
    #mic-slot { margin-bottom: 4px; }
    #status { min-height: 22px; font-size: 14px; color: #6e6e73; margin-bottom: 16px; }
    #status.error { color: #b3261e; }
    #transcript {
      display: block; width: 100%; box-sizing: border-box; resize: vertical;
      text-align: left; background: #fff; border: none; border-radius: 14px;
      padding: 18px 20px; min-height: 120px;
      font: inherit; color: inherit;
      box-shadow: 0 6px 14px rgba(0, 0, 0, .06);
    }
    #transcript::placeholder { color: #aeaeb4; }
    #transcript:focus { outline: 2px solid #d8d8de; }
    #clear {
      margin-top: 12px; padding: 8px 22px;
      border: none; border-radius: 999px; cursor: pointer;
      background: var(--tonal); color: var(--charcoal);
      font: 600 14px/1.4 inherit;
    }
    #clear:hover { background: #dcdce2; }
  </style>
</head>
<body>
  <main>
    <h1>reed-web</h1>
    <p class="sub">Hold the mic, speak, release — clean text comes back.</p>

    <label for="endpoint">reed-backend endpoint</label>
    <input id="endpoint" value="http://localhost:8080/api/transcribe" spellcheck="false" />

    <label for="language">Language</label>
    <select id="language">
      <option value="">Auto</option>
      <option value="en">English</option>
      <option value="hy">Հայերեն</option>
      <option value="ru">Русский</option>
    </select>

    <div id="mic-slot"></div>
    <div id="status">Hold to talk</div>

    <textarea id="transcript" placeholder="Transcripts appear here — edit freely." spellcheck="true"></textarea>
    <button id="clear" type="button">Clear</button>
  </main>

  <script type="module">
    import "reed-web";

    const slot = document.getElementById("mic-slot");
    const endpointInput = document.getElementById("endpoint");
    const languageSelect = document.getElementById("language");
    const status = document.getElementById("status");
    const transcript = document.getElementById("transcript");

    languageSelect.value = localStorage.getItem("reed.language") ?? "";

    // <reed-mic> reads its endpoint once when attached, so swap in a fresh
    // element whenever the endpoint changes. The language attribute, by
    // contrast, is re-read every take — no re-mount needed.
    function mountMic() {
      slot.replaceChildren();
      const mic = document.createElement("reed-mic");
      mic.setAttribute("endpoint", endpointInput.value.trim());
      syncLanguage(mic);
      slot.append(mic);
    }
    function syncLanguage(mic = slot.querySelector("reed-mic")) {
      if (!mic) return;
      if (languageSelect.value) mic.setAttribute("language", languageSelect.value);
      else mic.removeAttribute("language");
    }
    endpointInput.addEventListener("change", mountMic);
    languageSelect.addEventListener("change", () => {
      localStorage.setItem("reed.language", languageSelect.value);
      syncLanguage();
    });
    mountMic();

    slot.addEventListener("reed:result", (event) => {
      status.className = "";
      status.textContent = "Hold to talk";
      const text = event.detail.text;
      transcript.value = transcript.value ? `${transcript.value}\n${text}` : text;
      transcript.scrollTop = transcript.scrollHeight;
    });

    document.getElementById("clear").addEventListener("click", () => {
      transcript.value = "";
      transcript.focus();
    });

    slot.addEventListener("reed:error", (event) => {
      status.className = "error";
      const error = event.detail.error;
      status.textContent = error instanceof Error ? error.message : String(error);
      console.error("reed:error", error);
    });
  </script>
</body>
</html>
